<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla en Escalera</title>
    <link rel="stylesheet" href="css/main.css">

    <style>

       

        table{
            border-collapse: collapse;
        }

        td{
            width: 80px;
            height: 80px;
            border: 0.1px solid rgb(17, 231, 238);
            text-align: center;
            color: rgb(216, 13, 206);
            font-size: 30px;
            font-weight: bold;
            
        }


    </style>
</head>

<body>
    <header style="color: #39FF14;">
        <h1>EJERCICIO TABLAS</h1>
    </header>
    <table>

        <tr>
            <td style="background-color: rgba(0, 255, 255, 0.192);">X</td>
            <td colspan="5" style="background-color: rgb(0, 0, 0);"></td>
        </tr>

        <tr>
            <td style="background-color: #37ff143d;">X</td>
            <td style="background-color: rgba(240, 248, 255, 0.308);">X</td>
            <td colspan="4" style="background-color: rgb(0, 0, 0);"></td>
        </tr>

        <tr>
            <td style="background-color: rgba(226, 241, 7, 0.363);">X</td>
            <td style="background-color: rgba(42, 9, 228, 0.336);">X</td>
            <td style="background-color: rgba(255, 0, 0, 0.288);">X</td>
            <td colspan="3" style="background-color: black;"></td>
        </tr>

        <tr>
            <td style="background-color: rgba(255, 99, 71, 0.281);">X</td>
            <td style="background-color: rgba(238, 130, 238, 0.356);">X</td>
            <td style="background-color: rgba(0, 255, 128, 0.288);">X</td>
            <td style="background-color: rgba(105, 90, 205, 0.322);">X</td>
            <td colspan="2" style="background-color: black;"></td>
        </tr>

        <tr>
            <td style="background-color: rgba(160, 81, 45, 0.288);">X</td>
            <td style="background-color: rgba(220, 20, 60, 0.281);">X</td>
            <td style="background-color: rgba(153, 205, 50, 0.356);">X</td>
            <td style="background-color: rgba(216, 191, 216, 0.336);">X</td>
            <td style="background-color: rgba(133, 177, 194, 0.425);"> X</td>
            <td style="background-color: black;"></td>
        </tr>

        <tr>
            <td style="background-color: rgba(0, 0, 0, 0.329);">X</td>
            <td style="background-color: rgba(255, 127, 80, 0.281);">X</td>
            <td style="background-color: rgba(184, 135, 11, 0.397);">X</td>
            <td style="background-color: rgba(112, 128, 144, 0.342);">X</td>
            <td style="background-color: rgba(65, 105, 225, 0.288);">X</td>
            <td style="background-color: #dd0b9e3d;">X</td>
        </tr>

    </table>

</body>
</html>
